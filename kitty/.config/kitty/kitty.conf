# Portions from @Tmw
# https://github.com/Tmw/dotfiles/blob/ffe0a951b1aa6a4fda05c7bd98ba2a9aff442700/.config/kitty/kitty.conf

# General {{{
allow_remote_control yes
#startup_session ~/.config/kitty/startup.conf
# I'd like to use lvim, but Python is crashing for some reason
# editor lvim
#shell_integration disabled
mouse_map left click ungrabbed mouse_handle_click selection link prompt

# store 10M of scrollback for viewing in a separate pager
scrollback_pager_history_size 10
# }}}

# Fonts {{{

font_family      SauceCodePro Nerd Font
font_size 16.0

# }}}

# Terminal bell {{{

enable_audio_bell no
bell_on_tab no

# }}}

# Window layout {{{

# don't draw extra borders, but fade the inactive text a bit
active_border_color none
inactive_text_alpha 0.6

# }}}

# Tab bar {{{

# tabbar should be at the top
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_activity_symbol 💻

tab_bar_style powerline
# tab_powerline_style round

# tab_bar_style separator
# tab_separator " |"

# }}}

# Colorscheme {{{

include colors/nightfox/dawnfox.conf
# include colors/tokyonight_storm.conf
# include colors/tokyonight_day.conf
# include colors/papercolor/papercolor-light.conf
# include colors/inspired_github.conf

# }}}

# OS Specific Tweaks {{{

## Linux
wayland_titlebar_color system

## macOS
macos_titlebar_color system
# }}}

# Keyboard shortcuts {{{

# open new split (window) with cmd+d retaining the cwd
map kitty_mod+d new_window_with_cwd

# open new tab with ctrl+t
map kitty_mod+t new_tab_with_cwd

# switch between next and previous splits
map ctrl+]        next_window
map ctrl+[        previous_window

# clear the terminal screen
map ctrl+shift+k combine : clear_terminal scrollback active : send_text normal,application \x0c

# jump to beginning and end of word
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66

# jump to beginning and end of line
map ctrl+left send_text all \x01
map ctrl+right send_text all \x05

# Map ctrl + <num> to corresponding tabs
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# changing font sizes
map ctrl+equal    change_font_size all +2.0
map ctrl+minus    change_font_size all -2.0
map ctrl+0        change_font_size all 0

# Open current scrollback in another window
map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting less +G -R

map ctrl+f launch --allow-remote-control ~/.dotfiles/bin/kitty-fzf-tab.sh
# }}}
